<!DOCTYPE html>
<html>
<head>
    <title>Register | FinBotics</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
            width: 320px;
        }
        h2 {
            color: #60a5fa;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        a { color: #60a5fa; }
    </style>
</head>
<body>
<div class="container">
    <h2>Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already registered?
        <a href="{% url 'login' %}">Login</a>
    </p>
</div>
</body>
</html>
